<!doctype html>
<html lang="en" data-theme="green">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INCR.OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="crt" class="crt scan flicker">
    <div id="boot" class="boot"></div>

    <main id="app" class="app hidden">
      <header class="top">
        <pre class="logo"> ___ _  _  ___ ___    ___  ___
|_ _| \| |/ __| _ \  / _ \/ __|
 | || .` | (__|   / | (_) \__ \
|___|_|\_|\___|_|_\(_)___/|___/</pre>
        <div class="status">
          <div class="big"><span class="dim">BYTES</span> <span id="points">10</span></div>
          <div class="rate">+<span id="pps">0</span> B/s</div>
          <div class="subcur" id="subcur"></div>
        </div>
      </header>

      <div class="newswrap">
        <div class="newsbar">
          <button id="newsBtn" class="newsbtn" type="button" aria-expanded="false" aria-controls="newsPanel">NEWS</button>
          <button id="musicBtn" class="newsbtn musicbtn" type="button" aria-label="Music on/off" aria-pressed="true" title="Music on/off">&#9835;</button>
          <div id="news" class="news" aria-live="off"><span id="newsText"></span></div>
        </div>
        <div id="newsPanel" class="newspanel hidden" role="dialog" aria-label="News">
          <div class="np-head">
            <button type="button" class="npbtn" data-np="recent">RECENT</button>
            <button type="button" class="npbtn" data-np="updates">UPDATES</button>
            <span class="np-gap"></span>
            <button type="button" class="npbtn" id="npTicker"></button>
            <button type="button" class="npbtn" id="npClose" aria-label="Close news">X</button>
          </div>
          <div id="npBody" class="np-body"></div>
        </div>
      </div>

      <nav id="taskbar" class="taskbar hidden" aria-label="windows">
        <button type="button" class="gbtn" data-act="tab:proc" data-tab-btn="proc">Processes</button>
        <button type="button" class="gbtn" data-act="tab:sys" data-tab-btn="sys">System</button>
        <button type="button" class="gbtn" id="tabTerm" data-act="tab:term" data-tab-btn="term">Terminal</button>
      </nav>

      <div id="gui" class="gui hidden">
        <section class="win" id="winProc" aria-label="Processes">
          <div class="win-title"><span class="w-sys" aria-hidden="true"></span><span class="w-name">Processes</span><span class="w-ctl" aria-hidden="true"><i>&#9660;</i><i>&#9650;</i></span></div>
          <div class="win-menu"><button type="button" data-act="maxall">Max All!</button><button type="button" data-act="help">Help!</button></div>
          <div class="win-body" id="procRows"></div>
        </section>
        <section class="win" id="winSys" aria-label="System">
          <div class="win-title"><span class="w-sys" aria-hidden="true"></span><span class="w-name">System</span><span class="w-ctl" aria-hidden="true"><i>&#9660;</i><i>&#9650;</i></span></div>
          <div class="win-menu"><button type="button" data-act="ach" id="achMenuItem">Achievements!</button><button type="button" data-act="news">News!</button></div>
          <div class="win-body" id="sysBody"></div>
        </section>
      </div>

      <section id="term" class="term">
        <div class="win-title term-title"><span class="w-sys" aria-hidden="true"></span><span class="w-name" id="termTitle">Terminal</span><span class="w-ctl" aria-hidden="true"><i>&#9660;</i><i>&#9650;</i></span></div>
        <div id="log"></div>
        <div id="objective" class="objective hidden"></div>
        <div id="confirmBar" class="confirm hidden" role="alert">
          <span id="confirmText"></span>
          <button type="button" class="gbtn" data-act="yes">YES</button>
          <button type="button" class="gbtn" data-act="no">NO</button>
        </div>
        <label class="prompt"><span>root@incr:~$</span><input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="type /help" aria-label="command"></label>
        <div id="keys" class="keys hidden" aria-label="touch keys">
          <button type="button" data-key="tab">TAB</button>
          <button type="button" data-key="up">UP</button>
          <button type="button" data-key="down">DOWN</button>
          <button type="button" data-key="help">/help</button>
          <button type="button" data-key="max">/max</button>
        </div>
      </section>
    </main>

    <div id="achMenu" class="menu hidden" role="dialog" aria-label="Achievements" tabindex="-1">
      <div class="menu-head"><span id="amHead"></span><button type="button" class="npbtn" id="amClose" aria-label="Close achievements">X</button></div>
      <div class="menu-tabs">
        <button type="button" class="npbtn" data-amf="all">ALL</button>
        <button type="button" class="npbtn" data-amf="unlocked">UNLOCKED</button>
        <button type="button" class="npbtn" data-amf="locked">LOCKED</button>
      </div>
      <div id="amGrid" class="am-grid"></div>
      <div id="amDetail" class="am-detail"></div>
      <div class="menu-foot">arrows move · Tab filter · Esc close</div>
    </div>

    <!-- splash screen of the graphical environment (first reboot) -->
    <div id="splash" class="splash hidden" aria-hidden="true">
      <div class="splash-logo">
        <div class="sl-title"></div>
        <div class="sl-panes"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="splash-name">INCR.OS</div>
      <div class="splash-sub">Graphical Environment</div>
      <div class="splash-ver">Version 2.0</div>
      <div class="splash-copy">Copyright (c) Incremental Systems Corp., 1987.</div>
    </div>

    <!-- event message box (graphical mode) -->
    <div id="toast" class="toast hidden" role="status">
      <span id="toastText"></span>
      <button type="button" class="gbtn" id="toastBtn" data-act="event"></button>
    </div>
  </div>
  <script src="big.js"></script>
  <script src="skins.js"></script>
  <script src="news.js"></script>
  <script src="filesystem.js"></script>
  <script src="music.js"></script>
  <script src="gui.js"></script>
  <script src="game.js"></script>
</body>
</html>
